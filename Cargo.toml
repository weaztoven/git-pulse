[package]
name = "git-pulse"
version = "0.3.1"
edition = "2021"
description = "A terminal-based GitHub tracking and control tool"
license = "MIT"
repository = "https://github.com/weaztoven/git-pulse"
readme = "README.md"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
open = "5.1"
arboard = "3.3"